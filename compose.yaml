
services:
  gastronomics:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gastronomics-dev
    working_dir: /app
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - gastronomics_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: >
      sh -c "npm install &&
             npm run dev -- --host 0.0.0.0"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gastronomics-api
    working_dir: /app
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      NODE_ENV: development
    volumes:
      - .:/app
      - gastronomics_api_modules:/app/node_modules
    command: node api/dev-server.js
    restart: unless-stopped

volumes:
  gastronomics_modules:
  gastronomics_api_modules:
